name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        sdk: [sdk2013, bms, portal2, l4d, l4d2]
    steps:
      - uses: actions/checkout@v4

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v3
        with:
          msbuild-architecture: x64

      - name: Check out HL2SDK branch
        shell: pwsh
        run: git clone --depth 1 --branch ${{ matrix.sdk }} https://github.com/alliedmodders/hl2sdk.git dependencies/hl2sdk

      - name: Build release DLL
        shell: pwsh
        run: msbuild src/Twitch.sln /m /p:Configuration=Release /p:Platform=x86 /p:SourceEngine=${{ matrix.sdk }} /p:HL2SDKRoot=$env:GITHUB_WORKSPACE\dependencies\hl2sdk

      - uses: actions/upload-artifact@v4
        with:
          name: SourceCommandPipe-${{ matrix.sdk }}
          path: src/build/Release/SourceCommandPipe-${{ matrix.sdk }}.dll
          if-no-files-found: error

  release:
    needs: build
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: SourceCommandPipe-*
          path: release
          merge-multiple: true

      - name: Add example pipe client
        shell: pwsh
        run: Copy-Item examples/test-pipe.ps1 release/test-pipe.ps1

      - name: Create GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create $env:GITHUB_REF_NAME release/* --repo $env:GITHUB_REPOSITORY --generate-notes --verify-tag
