name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Build release DLL
        shell: pwsh
        run: msbuild src/Twitch.sln /m /p:Configuration=Release /p:Platform=x86

      - name: Create GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create $env:GITHUB_REF_NAME src/build/Release/SourceCommandPipe.dll --generate-notes --verify-tag
