name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Build release DLL
        shell: pwsh
        run: msbuild src/Twitch.sln /m /p:Configuration=Release /p:Platform=x86

      - name: Upload DLL
        uses: actions/upload-artifact@v4
        with:
          name: SourceCommandPipe-windows-x86
          path: src/build/Release/SourceCommandPipe.dll
          if-no-files-found: error
